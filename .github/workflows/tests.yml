name: Starlark Go Tests
on:
  push:
    branches: [trunk]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark-fixtures:
    name: Benchmark fixtures
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'air-ci' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Check every pinned benchmark configuration
        working-directory: fork/bench
        shell: bash
        env:
          GOWORK: 'off'
        run: |
          bash test-samples.sh
          export GOTMPDIR
          GOTMPDIR=$(mktemp -d "$RUNNER_TEMP/bench-fixtures.XXXXXX")
          go test -mod=readonly ./...
          go test -mod=readonly -modfile=fork.go.mod -tags=forkhooks ./...
          go test -mod=readonly -modfile=current.go.mod -tags=forkhooks,forkbudget ./...
  runner-check:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'air-ci' }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Verify native unprivileged Linux runner
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(id -u)" -ne 0
          printf 'platform=%s/%s uid=%s\n' "$(uname -s)" "$(uname -m)" "$(id -u)"
  build:
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go-version: [1.25.x, 1.26.x, 1.27.x]
    # Linux uses Runmux; native macOS/Windows remain explicit matrix cells.
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && (vars.CI_LINUX_RUNNER || 'air-ci') || matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use executable Go temporary directory on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go_tmp=$(mktemp -d "$RUNNER_TEMP/starlark-go.XXXXXX")
          printf 'GOTMPDIR=%s\n' "$go_tmp" >>"$GITHUB_ENV"
      - name: Run tests
        shell: bash
        run: internal/test.sh
      - name: Reconstruct committed source
        if: matrix.os == 'ubuntu-24.04' && matrix.go-version == '1.25.x'
        shell: bash
        run: |
          git fetch --no-tags origin 'refs/tags/upstream/*:refs/tags/upstream/*'
          go run ./fork -revision HEAD
